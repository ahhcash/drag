name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create venv and install deps
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e '.[dev]'

      - name: Run ruff
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .

      - name: Run mypy
        run: |
          source .venv/bin/activate
          mypy .

      - name: Build package
        run: |
          source .venv/bin/activate
          python -m build
