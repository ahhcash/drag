name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create venv and install deps
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e '.[dev]'

      - name: Run ruff
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .

      - name: Run mypy
        run: |
          source .venv/bin/activate
          mypy .

      - name: Build package
        run: |
          source .venv/bin/activate
          python -m build

  publish:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
      needs: [build, publish]
      if: github.ref == 'refs/heads/master'
      runs-on: ubuntu-latest
      steps:
        - name: Install doctl
          uses: digitalocean/action-doctl@v2
          with:
            token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

        - name: Setup SSH
          run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

        - name: Generate GHCR Token
          id: generate-token
          uses: actions/create-github-app-token@v1
          with:
            app-id: ${{ secrets.GH_APP_ID }}
            private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

        - name: Deploy to DO droplet
          run: |
            doctl compute ssh dragonlord --ssh-command '
              echo ${{ steps.generate-token.outputs.token }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
              # pull latest image
              docker pull ghcr.io/${{ github.repository }}:latest
              
              docker image prune -a --force --filter "until=24h"
              
              # stop and remove existing container if it exists
              docker stop drag || true
              docker rm drag || true

              # run new container
              docker run -d \
              --name drag \
              --restart unless-stopped \
              --env DB_USER="${{ secrets.DB_USER }}" \
              --env DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              --env DB_HOST="${{ secrets.DB_HOST }}" \
              --env DB_PORT="${{ secrets.DB_PORT }}" \
              --env DB_NAME="${{ secrets.DB_NAME }}" \
              --env OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              --env ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
              --env PREFECT_API_KEY="${{ secrets.PREFECT_API_KEY }}" \
              --env PREFECT_API_URL="${{ secrets.PREFECT_API_URL }}" \
              -p 8000:8000 \
              ghcr.io/${{ github.repository }}:latest
            
              echo "container status:"
              docker ps -a
              echo "container logs:"
              docker logs drag
            '