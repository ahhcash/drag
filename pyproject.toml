[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drag"
version = "0.1.0"
description = "dRAG - RAG over your docs!"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "crawlee>=0.5.2",
    "fastapi>=0.115.7",
    "html2text>=2024.2.26",
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
    "lxml>=5.3.0",
    "requests>=2.32.3",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.1",
    "ruff>=0.9.3",
    "types-requests",
    "types-beautifulsoup4",
    "build>=1.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
