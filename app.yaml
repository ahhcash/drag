name: dRAG
region: nyc
services:
  - name: rag-api
    environment_slug: python
    github:
      branch: master
      deploy_on_push: true
      repo: ahhcash/drag
    envs:
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${ANTHROPIC_API_KEY}
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${OPENAI_API_KEY}
      - key: DB_USER
        scope: RUN_TIME
        type: SECRET
        value: ${DB_USER}
      - key: DB_HOST
        scope: RUN_TIME
        type: SECRET
        value: ${DB_HOST}
      - key: DB_PORT
        scope: RUN_TIME
        type: SECRET
        value: ${DB_PORT}
      - key: DB_NAME
        scope: RUN_TIME
        type: SECRET
        value: ${DB_NAME}
      - key: DB_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ${DB_PASSWORD}
    build_command: pip install -e '.[dev]'
    run_command: uvicorn server:app --host 0.0.0.0 --port 8080